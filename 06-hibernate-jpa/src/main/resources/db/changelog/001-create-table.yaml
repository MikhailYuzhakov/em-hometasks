databaseChangeLog:
  - changeSet:
      id: 1
      author: yuzhakovmikhail
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: description
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: completed
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: Дата создание задачи
              - column:
                  name: updated_at
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: Дата обновления задачи