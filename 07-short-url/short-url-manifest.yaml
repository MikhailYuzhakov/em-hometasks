apiVersion: apps/v1
kind: Deployment
metadata:
  name: short-url-deployment
  labels:
    app: short-url
spec:
  replicas: 1
  selector:
    matchLabels:
      app: short-url
  template:
    metadata:
      labels:
        app: short-url
    spec:
      containers:
      - name: short-url
        image: short-url:1.0
        imagePullPolicy: Never # Важно для локальных образов minikube
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: short-url-service
spec:
  selector:
    app: short-url
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: NodePort
